<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#888}body{display:flex;justify-content:center}iframe{border:0;display:block}</style></head>
<body><script>const q=new URLSearchParams(location.search);const f=document.createElement('iframe');f.width=q.get('w');f.height=q.get('h');f.src=q.get('u');
// Give the framed page window focus, so a focused element always paints its :focus-visible ring (finding 7 of review 1).
f.addEventListener('load',()=>f.contentWindow.focus());
document.body.appendChild(f);</script></body></html>
